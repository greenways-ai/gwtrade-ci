name: GWTrade CI

on:
  repository_dispatch:
    types: [code-base-changed]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA from greenways-ai/gwtrade
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HARA_FOUNDATION_VERSION: "0.1.16"
  HARA_FOUNDATION_REF: "a706cd91d82ddce3003d75a5d0edc9178c6cc6ef"
  HARA_NATIVE_VERSION: "0.1.21"

jobs:
  prepare:
    name: Validate source revision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      source_ref: ${{ steps.source.outputs.ref }}
    steps:
      - name: Validate dispatch payload
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD_REPOSITORY: ${{ github.event.client_payload.source_repository || '' }}
          PAYLOAD_REF: ${{ github.event.client_payload.source_ref || '' }}
          PAYLOAD_SHA: ${{ github.event.client_payload.source_sha || '' }}
          INPUT_SHA: ${{ inputs.source_sha || '' }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            test "$PAYLOAD_REPOSITORY" = "greenways-ai/gwtrade"
            test "$PAYLOAD_REF" = "refs/heads/main"
            source_sha="$PAYLOAD_SHA"
            source_ref="$PAYLOAD_REF"
          else
            source_sha="$INPUT_SHA"
            source_ref="manual"
          fi

          [[ "$source_sha" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "ref=$source_ref" >> "$GITHUB_OUTPUT"
          {
            echo "### GWTrade source"
            echo ""
            echo "- Repository: greenways-ai/gwtrade"
            echo "- Revision: $source_sha"
            echo "- Trigger ref: $source_ref"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Hara PostgreSQL tests
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: gwtrade-ci-${{ needs.prepare.outputs.source_sha }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 55222:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Create source checkout token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GWTRADE_CI_APP_ID }}
          private-key: ${{ secrets.GWTRADE_CI_APP_PRIVATE_KEY }}
          owner: greenways-ai
          repositories: gwtrade
          permission-contents: read

      - name: Checkout exact GWTrade revision
        uses: actions/checkout@v4
        with:
          repository: greenways-ai/gwtrade
          ref: ${{ needs.prepare.outputs.source_sha }}
          token: ${{ steps.app-token.outputs.token }}
          path: gwtrade
          fetch-depth: 1

      - name: Checkout pinned Hara Foundation source
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara
          ref: ${{ env.HARA_FOUNDATION_REF }}
          path: hara-foundation
          fetch-depth: 1

      - name: Download and verify Hara Native
        shell: bash
        run: |
          set -euo pipefail
          native_archive="hara-native-${HARA_NATIVE_VERSION}-linux-x86_64.tar.gz"
          native_base="https://github.com/hara-lang/hara-native/releases/download/v${HARA_NATIVE_VERSION}"
          mkdir -p "${RUNNER_TEMP}/hara-native"
          curl --fail --silent --show-error --location --retry 3 "${native_base}/SHA256SUMS" --output "${RUNNER_TEMP}/SHA256SUMS"
          curl --fail --silent --show-error --location --retry 3 "${native_base}/${native_archive}" --output "${RUNNER_TEMP}/${native_archive}"
          expected="$(awk -v name="${native_archive}" '$2 == name || $2 == ("*" name) { print $1 }' "${RUNNER_TEMP}/SHA256SUMS")"
          test -n "${expected}"
          actual="$(sha256sum "${RUNNER_TEMP}/${native_archive}" | cut -d ' ' -f 1)"
          test "${actual}" = "${expected}"
          tar -xzf "${RUNNER_TEMP}/${native_archive}" -C "${RUNNER_TEMP}/hara-native"
          native_path="$(find "${RUNNER_TEMP}/hara-native" -type f -name hara-native -print -quit)"
          test -n "${native_path}"
          chmod +x "${native_path}"
          echo "HARA_NATIVE=${native_path}" >> "${GITHUB_ENV}"
          echo "HARA_NATIVE=${native_path}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Build and install verified Hara Foundation package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/hara-dist"
          foundation_harp="${RUNNER_TEMP}/hara-foundation-${HARA_FOUNDATION_VERSION}.harp"
          export HARA_DIST_HOME="${RUNNER_TEMP}/hara-dist"
          "${HARA_NATIVE}" bundle build "${GITHUB_WORKSPACE}/hara-foundation" --output "${foundation_harp}"
          "${HARA_NATIVE}" bundle verify "${foundation_harp}"
          "${HARA_NATIVE}" bundle install "${foundation_harp}"
          echo "HARA_DIST_HOME=${HARA_DIST_HOME}" >> "${GITHUB_ENV}"

      - name: Enable PostgreSQL extensions
        shell: bash
        run: |
          set -euo pipefail
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS citext;' -c 'CREATE EXTENSION IF NOT EXISTS pgcrypto;' -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'

      - name: Run focused Hara tests
        working-directory: gwtrade
        shell: bash
        env:
          CI: "true"
        run: |
          set -euo pipefail
          "${HARA_NATIVE}" test --project "${PWD}" --file test-lang/gwdb/common/type_system_base_test.hal
          "${HARA_NATIVE}" test --project "${PWD}" --file test-lang/gwdb/common/type_system_seed_test.hal
          "${HARA_NATIVE}" test --project "${PWD}" --file test-lang/gwdb/test/postgres_test.hal

      - name: Run complete Hara project suite
        working-directory: gwtrade
        shell: bash
        env:
          CI: "true"
        run: |
          set -euo pipefail
          "${HARA_NATIVE}" test --project "${PWD}"
